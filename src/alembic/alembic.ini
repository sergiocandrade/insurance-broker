# A generic, single database configuration.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os

# Set this if you prefer not to pass -x db_url=... at runtime.
# sqlalchemy.url = mysql+mysqlconnector://user:password@host:3306/schema

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
