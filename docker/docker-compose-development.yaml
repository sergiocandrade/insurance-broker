# Docker Compose for DEVELOPMENT environment
#
# The Google Maps API key is a real secret and is NOT hardcoded here — it is
# read from docker/.env (gitignored via `.env*`; see docker/.env.example).
# Everything else below is a throwaway local-dev default, not a secret.
#
# Usage:
#   cp .env.example .env   # once, then fill in GOOGLE_MAPS_API_KEY
#   cd docker
#   export ARIVI_ENVIRONMENT=development
#   docker compose -f docker-compose-development.yaml up -d

version: '3.8'
services:
  insurance-broker-mysql-local:
    image: mysql:8.0
    container_name: insurance-broker-mysql-local
    restart: always
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: strong_root_password
      MYSQL_DATABASE: insurance-broker
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - insurance-broker-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  insurance-broker-bff:
    links:
      - insurance-broker-mysql-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: insurance-broker-bff
    ports:
      - "5002:8510"
    container_name: insurance-broker-bff
    volumes:
      - ../src:/app
      - ~/.aws:/root/.aws
    environment:
      AWS_REGION: '${AWS_REGION:-us-east-1}'
      DATABASE_URL: '${DATABASE_URL:-mysql+pymysql://app_user:app_password@host.docker.internal:3310/insurance-broker?charset=utf8mb4}'
      COGNITO_USER_POOL_ID: 'us-east-1_tzVtSqAhU'
      COGNITO_CLIENT_ID: '782jk9k3ln1f4n82n2me9boqt5'
      COGNITO_CLIENT_SECRET: '1b84uv7g8vk7kfj1l4u1cnilo8udbkvr9urett2asvsa3mol04sk'
      
    command:
      uvicorn presentation.apis.bff.main:app --host 0.0.0.0 --port 8510 --reload


volumes:
  insurance-broker-mysql-data:
